[package]
name = "defold-nvim-core"
version = "0.14.0-beta2"
edition = "2024"

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
tar = "0.4.46"
flate2 = "1.1.11"
zip = "9.5.1"
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = [
    "rustls",
    "blocking",
    "json",
] }
rust-ini = "0.21.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha3 = "0.12.0"
tracing = "0.1.44"
which = "8.0.6"
walkdir = "2.5.0"
serde_yaml = "0.9.34"
textwrap = "0.16.4"
fs_extra = "1.3.0"
hex = "0.4.3"
chumsky = "0.13.0"

[target.'cfg(target_os = "macos")'.dependencies]
dmg = "0.1.2"

[dev-dependencies]
pretty_assertions = "1.4.1"

[package.metadata.cargo-machete]
ignored = ["rust-ini"]

[lints]
workspace = true
