[package]
name = "defold-nvim-sidecar"
version = "0.14.0-beta3"
edition = "2024"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
defold-nvim-core = { path = "../core" }
mlua = { version = "0.12.2", features = [
    "module",
    "luajit",
    "serde",
    "anyhow",
] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"

[lints]
workspace = true
